[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-asylum-project"
version = "0.1.0"
description = "A deliberately unnecessary but technically serious DEV Asylum experiment."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "The DEV Asylum"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
dev-asylum-project = "dev_asylum_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
